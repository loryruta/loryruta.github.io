<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://kit.fontawesome.com/9fe1eff927.js" crossorigin="anonymous"></script>
    <title>Lorenzo Rutayisire</title>
    <!-- Redirect in 8 seconds -->
    <meta http-equiv="refresh" content="8;url=https://github.com/loryruta/">
    <script>
        let seconds = 8;
        function countdown() {
            seconds--;
            if (seconds <= 0) {
                window.location.href = "https://github.com/loryruta/";
            } else {
                document.getElementById('countdown-text').innerText = seconds;
                setTimeout(countdown, 1000);
            }
        }
        window.onload = () => {
            setTimeout(countdown, 1000);
        };
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .footer {
            padding: 20px;
            text-align: center;
        }
        .contacts i {
            margin: 0 10px;
            color: #394FCE;
        }
        .contacts a {
            text-decoration: none;
        }
        .avatar {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }
        h2 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: normal;
            color: #333;
            max-width: 600px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="main-content container">
        <img src="assets/avatar.jpg" class="avatar">
        <span style="margin-top: 20px; font-size: 1.2em">
            My portfolio is work in progress. Redirecting you to a better place in <span id="countdown-text">8</span>...
        </span>
    </div>

    <div class="footer container pb-5">
        <hr style="color: #394FCE">
        <div class="contacts">
            <!-- GitHub -->
            <a target="_blank" href="https://github.com/loryruta/">
                <i class="fa fa-2x fa-github"></i>
            </a>

            <!-- Telegram -->
            <a target="_blank" href="https://t.me/loryruta/">
                <i class="fa fa-2x fa-telegram"></i>
            </a>

            <!-- Linkedin -->
            <a target="_blank" href="https://www.linkedin.com/in/lorenzo-rutayisire-66bb941a9/">
                <i class="fa fa-2x fa-linkedin"></i>
            </a>

            <!-- Mail -->
            <a href="mailto:loryruta23@gmail.com">
                <i class="fa fa-2x fa-envelope"></i>
            </a>
        </div>
    </div>
</body>
</html>
